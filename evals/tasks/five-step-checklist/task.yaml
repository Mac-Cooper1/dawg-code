id: five-step-checklist
title: Five changes for the next wordtally release
prompt: |
  A few things for the next wordtally release, please.

  Words with an apostrophe inside, like "don't" or "o'clock", are currently
  split in two. They should count as one word. An apostrophe at the start or
  end of a word (as in 'quoted') is not part of the word. Only the straight
  apostrophe ' matters here.

  Add a `--min-length N` option to the CLI that ignores words shorter than N
  characters (default 1, which means no filtering; an apostrophe counts as a
  character). The filtering happens before choosing the top words.

  Add a `--json` flag that prints the result as a JSON array of
  `[word, count]` pairs, with the same words in the same order as the normal
  output, instead of the tab-separated lines.

  Write tests for the two new options in a new file `tests/test_cli.py`.
  The whole suite must pass with `python3 -m unittest discover -s tests`.

  Finally, bump the version to 1.4.0 and add a `## 1.4.0` section at the top
  of CHANGELOG.md (above 1.3.0) with one bullet for each of the three
  changes above.
tags: [python, multi-step, task-list, cli, tests]
timeout_seconds: 1200
