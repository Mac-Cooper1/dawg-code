name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Fetch the pinned ripgrep (the Grep tool's tests need it)
        run: pnpm fetch-ripgrep
      - run: pnpm test

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Fetch the pinned ripgrep (the Grep tool's tests need it)
        run: pnpm fetch-ripgrep
      # One package at a time: the Mac runners have few, slow cores, and running several
      # packages' tests at once makes the ones that start child processes or local servers time out.
      - name: Test (one package at a time)
        run: pnpm -r --no-bail --if-present --workspace-concurrency=1 test
      - name: Validate eval tasks (fixture fails, reference solution passes)
        run: pnpm eval:validate

  e2e:
    name: End-to-end (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The engine's search tools and the composer's `@` file search use the bundled ripgrep.
      # No model runtime is needed: the tests use the mock engine or the scripted model server.
      - name: Fetch the pinned ripgrep
        run: pnpm fetch-ripgrep
      - name: Build the app and run the end-to-end tests
        run: pnpm --filter @dawg/desktop e2e
      - name: Keep the test output of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: apps/desktop/test-results
          retention-days: 7
          if-no-files-found: ignore
